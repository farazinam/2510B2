<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Form Validation Using Regular Expression</h1>
    
    <form onsubmit="validate()">
        <label for="">Enter Your Name</label>
        <input type="text" id="name">
        <p id="nameError" style="color: red;"></p>

        <label for="">Contact #</label>
        <input type="text" id="contact">
        <p id="contactError" style="color: red;"></p>
        
        <label for="">Email</label>
        <input type="text" id="email">
        <p id="emailError" style="color: red;"></p>


        <button type="submit"> Submit </button>
    </form>

    <script>
        function validate(){
            event.preventDefault();

           var n = document.getElementById("name").value;  //input
           var ne = document.getElementById("nameError"); //p

           var c = document.getElementById("contact").value;  //input
           var ce = document.getElementById("contactError"); //p

           var namePatt = /^[a-z]{3,10}$/
           var contactPatt = /^\d{11}$/

           if(n == ""){
            ne.innerHTML = "Name is Required";
            // document.getElementById("error").innerHTML = "Name is Required";
            
           }
           else if(!namePatt.test(n)){
            // document.getElementById("error").innerHTML = "please provide valid name that contains characters only"
            ne.innerHTML = "please provide valid name that contains characters only"
           }

           else if(c == ""){
            ce.innerHTML = "Contact Required"
           }

           else if(!contactPatt.test(c)){
            ce.innerHTML = "Must provide digits that contains 11 digits"
           }

           else{
            alert("Form Submitted Successfully!")
            // document.getElementById("error").innerHTML = ""
            ne.innerHTML = ""
            ce.innerHTML = ""
           }
           
        }
    </script>
</body>
</html>
