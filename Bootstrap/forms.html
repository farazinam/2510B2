<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.css">
</head>
<body>
    
    <h1>Forms</h1>

    <form>
        <label for="" class="form-label">Username</label>
        <input type="text" class="form-control form-control-lg w-25">
        <p class="form-text">please provide your correct username</p>

<input type="text" class="form-control form-control-lg w-25" disabled>
<input type="text" class="form-control form-control-lg w-25" value="Aptech" readonly>
<input type="text" class="form-control form-control-lg w-25" value="Aptech" disabled readonly>

<input type="text" class="form-control form-control-lg w-25 visually-hidden" value="Aptech">
<button class="btn btn-primary m-3">Search</button>
    </form>

    <form action="">
        <select class="form-control form-control-sm">
            <option value="" disabled selected>Select a semester</option>
            <option value="">CPISM</option>
            <option value="">DISM</option>
            <option value="">HDSE-I</option>
            <option value="" disabled>HDSE-II</option>
            <option value="">ADSE-I</option>
            <option value="">ADSE-II</option>
        </select>
    </form>

    <h2>Checkbox</h2>

    skills
    <div class="form-check">
        <input type="checkbox" class="form-check-input" name="" id="">
        <label for="" class="form-check-label">Software Engineer</label>
    </div>
    <div class="form-check">
        <input type="checkbox" class="form-check-input" checked name="" id="">
        <label for="" class="form-check-label">Accountant</label>
    </div>
    <div class="form-check">
        <input type="checkbox" class="form-check-input" name="" id="">
        <label for="" class="form-check-label">Graphic Designer</label>
    </div>

    <h2>RadioButton</h2>
    <div class="form-check">
        <input type="radio" class="form-check-input" name="" id="">
        <label for="" class="form-check-label">Graphic Designer</label>
    </div>
    <div class="form-check">
        <input type="radio" class="" name="" id="">
        <label for="" class="form-check-label">Graphic Designer</label>
    </div>

    <h2>Toggle Button</h2>
    <div class="form-check form-switch">
        <input type="checkbox" class="form-check-input" name="" id="">
        <label for="" class="form-check-label">Graphic Designer</label>
    </div>

    <h2>Range</h2>
    <input type="range" class="form-range" step="10">

    <h2>Input Group</h2>
    <div class="input-group">
        <label for="" class="input-group-text bg-success">Username</label>
        <input type="text" class="form-control">
    </div>

    <div class="input-group">
        <label for="" class="input-group-text bg-warning">
            <input type="radio" >
        </label>
        <input type="text" class="form-control form-control-lg">
    </div>

    <h2>Floating Label</h2>
    <div class="form-floating">
        <input type="text" placeholder="Enter Your Name" class="form-control w-25">
        <label for="" class="form-label">Name</label>
    </div>

    <script src="bootstrap/js/bootstrap.js"></script>
</body>
</html>
