<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden</title>
    <script src="jquery-4.0.0.min.js"></script>
    <link rel="shortcut icon" href="" type="image/x-icon">
</head>
<body>
    <p id="para1">Lorem ipsum dolor sit amet.</p>

    <button>Click to Implement Styling</button>

    <form>
        <input type="text">
        <p id="para2"></p>
       <button type="submit">submit</button>
    </form>


    <script>
        $(function (){
            //Mouse event
            $('button').mouseenter(function (){
                // $('p').css('color', 'lightblue');
                // $('p').css('background-color', 'gray');
                // $('p').css('font-family', 'cooper');

                $('#para1').css({'color' : 'blue', 'background-color' : 'lightblue'});
            })
            $('button').mouseleave(function (){
                $('#para1').css('font-family', 'cooper');
            })

            $('button').contextmenu(function (){
                event.preventDefault();
                $('#para1').css('width', '50%');
            })

            $('button').click(function (){
                $(this).css('color', 'green');
                $(this).css('background-color', 'lightgreen');
                $(this).css('border', 'none');
            })

            //Keyboard events (do it yourself)

            //Form Events
            $('form').submit(function (){
                event.preventDefault();

                var inpdata = $("input").val();
                $("#para2").html(inpdata);
            })

            $('input').focus(function (){
                // $('input').css('background-color', 'lightgreen');
                $(this).val("Enter Your Name");
            })

            $('input').blur(function (){
                $(this).css('background-color', 'yellow');
            })

            $('input').select(function (){
                $(this).css('border-radius', '40%');
            })
        })
    </script>
</body>
</html>
