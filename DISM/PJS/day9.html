    <script>
        // Call Back function

        //eg: 1
        function greet(name, callback){
            document.write("Hello "+ name);
            callback();
        }

        function callBackFn(){
            document.write("Hello Callback function");
        }

        greet("Ali ", callBackFn);

        //eg: 2
        function fetchData(callback){
            setTimeout(() => {
                document.write("Data Fetched");
                callback();
            }, 3000);
        }

        function processing(){
           document.write("Data is Processing..."); 
        }

        fetchData();
        processing();
