<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <input type="text" placeholder="Enter a Number">
        <input type="text" placeholder="Enter another Number">
        <p></p>
        <button type="submit">Add</button>
    </form>


    <script>
        document.getElementsByTagName("form")[0].addEventListener("submit", () => {
            event.preventDefault();
            var inp1 = document.getElementsByTagName("input")[0].value;
            var inp2 = document.getElementsByTagName("input")[1].value;
            var result = inp1 + inp2;

            document.getElementsByTagName("p")[0].innerHTML = result;
        });
    </script>
</body>
</html>
